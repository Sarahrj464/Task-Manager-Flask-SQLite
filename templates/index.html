<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    
    <link rel="stylesheet" href={{url_for('static',filename="style.css")}}>

  </head>

  <body>
    <h1>Sarah's Task Manager</h1>

    <h3>
      Total: {{total}} |
      Completed: {{completed}} |
      Remaining: {{remaining}}
    </h3>

    <form action="/add" method="POST">
      <input type="text" name="title" placeholder="Enter new Task" required />
      <button type="submit">Add Task</button>
    </form>

    <ul>
      {% for task in tasks %}
      <li>
        <a href="/toggle/{{task[0]}}">
          {% if task[2] == 1 %}
            ✔️
          {% else %}
            ⬜
          {% endif %}
        </a>
        {{task[1]}}

        <div>
          <a href="/edit/{{task[0]}}">✏️</a>
          <a href="/delete/{{task[0]}}">❌</a>
        </div>
      </li>
      {% endfor %}
    </ul>
  </body>
</html>
